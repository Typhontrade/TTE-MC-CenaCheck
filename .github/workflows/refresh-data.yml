name: Refresh TTE and MC data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download TTE XML
        env:
          TTE_API_KEY: ${{ secrets.TTE_API_KEY }}
        run: |
          curl -L --fail \
            "https://tte.rs/api/sr/products?output_type=xml&api_key=${TTE_API_KEY}" \
            -o tte.xml

      - name: Download MC XML
        env:
          MC_API_KEY: ${{ secrets.MC_API_KEY }}
        run: |
          curl -L --fail \
            "https://mobilnicirkus.rs/api/sr/products?output_type=xml&api_key=${MC_API_KEY}" \
            -o mc.xml

      - name: Save downloaded XML files
        run: |
          mkdir -p data
          mv tte.xml data/tte.xml
          mv mc.xml data/mc.xml

      - name: Commit updated XML files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/tte.xml data/mc.xml

          if git diff --cached --quiet; then
            echo "No changes in XML data."
          else
            git commit -m "Auto-refresh TTE and MC XML data"
            git push
          fi
